/* =================================
   BODY
================================= */

html,
body{

  background:#000;

  background-image:
    linear-gradient(
      rgba(0,0,0,.72),
      rgba(0,0,0,.88)
    ),
    url('https://pusat303p.com/image/BANNER-PUSAT303.webp');

  background-repeat:no-repeat;

  background-position:center top;

  background-size:cover;

  background-attachment:fixed;
}


body{

  position:relative;

  min-height:100vh;

  overflow-x:hidden;
}


/* =================================
   GOLD PARTICLE BACKGROUND
================================= */

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:

    radial-gradient(
      circle,
      rgba(0, 174, 255, 0.18) 1px,
      transparent 1.5px
    );

  background-size:18px 18px;

  opacity:.12;

  pointer-events:none;

  z-index:0;

  animation:
    particleMove 12s linear infinite;
}


@keyframes particleMove{

  0%{
    transform:translateY(0);
  }

  100%{
    transform:translateY(18px);
  }

}


/* =================================
   DIAGONAL LIGHT
================================= */

body::after{

  content:"";

  position:fixed;

  inset:-50%;

  background:

    repeating-linear-gradient(
      120deg,
      transparent 0 90px,
      rgba(0, 132, 255, 0.025) 90px 92px,
      transparent 92px 180px
    );

  pointer-events:none;

  z-index:0;

  animation:
    backgroundSweep 18s linear infinite;
}


@keyframes backgroundSweep{

  0%{
    transform:translateX(-5%);
  }

  50%{
    transform:translateX(5%);
  }

  100%{
    transform:translateX(-5%);
  }

}


/* =================================
   ARCADE FRAME
================================= */

.arcade-frame{

  position:relative;

  z-index:1;

  max-width:460px;

  margin:18px auto;

  background:

    radial-gradient(
      circle at 50% 0%,
      rgba(0, 145, 255, 0.08),
      transparent 35%
    ),

    linear-gradient(
      180deg,
      #292929 0%,
      #151515 42%,
      #080808 100%
    );

  border:4px solid #000;

  box-shadow:

    0 0 0 2px rgba(0, 115, 255, 0.85) inset,

    0 0 0 4px rgba(0, 85, 255, 0.12) inset,

    0 0 18px rgba(0, 140, 255, 0.28),

    0 0 35px rgba(0, 94, 255, 0.12),

    0 12px 35px rgba(0,0,0,.75);

  border-radius:20px;

  overflow:hidden;
}


/* GOLD AMBIENT LIGHT */

.arcade-frame::before{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:

    radial-gradient(
      circle at 12% 8%,
      rgba(0, 162, 255, 0.18),
      transparent 22%
    ),

    radial-gradient(
      circle at 88% 20%,
      rgba(0, 128, 255, 0.14),
      transparent 24%
    ),

    radial-gradient(
      circle at 50% 100%,
      rgba(0, 141, 229, 0.1),
      transparent 30%
    );

  z-index:0;

}


/* INNER CHROME BORDER */

.arcade-frame::after{

  content:"";

  position:absolute;

  inset:7px;

  border:1px solid rgba(0, 119, 255, 0.22);

  border-radius:14px;

  pointer-events:none;

  z-index:5;
}


/* =================================
   HUD
================================= */

.hud{

  position:relative;

  z-index:2;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  padding:11px 14px;

  font-family:'Press Start 2P',cursive;

  font-size:9px;

  letter-spacing:.5px;

  color:#fff;

  border-bottom:4px solid #000;

  background:

    linear-gradient(
      180deg,
      #a6e4ff 0%,
      #0059ff 28%,
      #0073ff 70%,
      #0065bd 100%
    );

  text-shadow:

    2px 2px 0 #000,

    0 0 7px rgba(255,255,255,.25);

  box-shadow:

    0 3px 10px rgba(0,0,0,.5),

    0 0 18px rgba(0, 157, 255, 0.18);

}


/* HUD SHINE */

.hud::before{

  content:"";

  position:absolute;

  left:0;

  top:0;

  width:100%;

  height:2px;

  background:

    linear-gradient(
      90deg,
      transparent,
      #fff,
      transparent
    );

  opacity:.8;

}


/* ONLINE */

.hud .online{

  color:#fff;

  text-shadow:

    2px 2px 0 #000,

    0 0 8px rgba(57,255,20,.65);

  animation:
    onlinePulse 2s ease-in-out infinite;
}


@keyframes onlinePulse{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.7;
  }

}


.hud .status{

  color:#fff;

  opacity:1;

}


/* =================================
   SCREEN
================================= */

.screen{

  position:relative;

  z-index:1;

  padding:12px 18px 28px;

  text-align:center;
}


/* =================================
   SCREEN LABEL
================================= */

.screen::before{

  display:block;

  width:100%;

  margin:0 auto 12px;

  padding:8px 10px;

  border:3px solid #000;

  border-radius:999px;

  font-family:'Press Start 2P',cursive;

  font-size:8px;

  color:#fff;

  text-shadow:

    2px 2px 0 #000,

    0 0 8px rgba(255,255,255,.2);

  background:

    linear-gradient(
      180deg,
      #a6e4ff 0%,
      #0059ff 35%,
      #005ce6 70%,
      #0052a9 100%
    );

  box-shadow:

    0 4px 0 #000,

    0 0 14px rgba(0, 140, 255, 0.25),

    inset 0 1px 0 rgba(255,255,255,.5);
}


/* =================================
   LOGO
================================= */

.logo-img{

  position:relative;

  padding:12px 0 5px;

  z-index:2;
}


/* GOLD AURA */

.logo-img::after{

  content:"";

  position:absolute;

  left:50%;

  top:50%;

  width:230px;

  height:105px;

  transform:translate(-50%,-50%);

  background:

    radial-gradient(
      ellipse,
      rgba(166, 222, 255, 0.42) 0%,
      rgba(0, 174, 255, 0.25) 28%,
      rgba(0, 162, 255, 0.12) 48%,
      transparent 70%
    );

  filter:blur(15px);

  z-index:0;

  animation:
    logoAura 3s ease-in-out infinite;
}


@keyframes logoAura{

  0%,100%{

    opacity:.65;

    transform:
      translate(-50%,-50%)
      scale(.92);
  }

  50%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.08);
  }

}


/* LOGO */

.logo-img amp-img{

  position:relative;

  z-index:2;

  margin:0 auto 12px;

  max-width:160px;

  filter:

    drop-shadow(
      0 0 6px rgba(0, 132, 255, 0.65)
    )

    drop-shadow(
      0 0 15px rgba(0, 145, 255, 0.45)
    )

    drop-shadow(
      0 0 28px rgba(0, 170, 255, 0.25)
    );

  animation:
    logoFloat 3s ease-in-out infinite,
    logoGlow 2.8s ease-in-out infinite;
}


/* LOGO FLOAT */

@keyframes logoFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-7px);
  }

}


/* LOGO GLOW */

@keyframes logoGlow{

  0%,100%{

    filter:

      drop-shadow(
        0 0 5px rgba(0, 140, 255, 0.45)
      )

      drop-shadow(
        0 0 12px rgba(0, 174, 255, 0.32)
      );

  }

  50%{

    filter:

      drop-shadow(
        0 0 10px rgba(166, 230, 255, 0.95)
      )

      drop-shadow(
        0 0 22px rgba(0, 162, 255, 0.75)
      )

      drop-shadow(
        0 0 38px rgba(0, 170, 255, 0.38)
      );

  }

}


/* =================================
   SYSTEM BADGE
================================= */

.system{

  display:inline-block;

  position:relative;

  margin:10px auto 22px;

  padding:10px 14px;

  border:3px solid #000;

  border-radius:12px;

  background:

    linear-gradient(
      180deg,
      #a6e4ff 0%,
      #0059ff 30%,
      #0073ff 65%,
      #0065bd 100%
    );

  color:#fff;

  font-family:'Press Start 2P',cursive;

  font-size:11px;

  line-height:1.7;

  text-shadow:

    2px 2px 0 #000;

  box-shadow:

    0 4px 0 #000,

    0 7px 15px rgba(0,0,0,.4),

    0 0 18px rgba(0, 174, 255, 0.3),

    inset 0 1px 0 rgba(255,255,255,.5);

  animation:
    systemFloat 2.8s ease-in-out infinite;

}


/* SYSTEM SHINE */

.system::before{

  content:"";

  position:absolute;

  top:2px;

  left:-80%;

  width:45%;

  height:100%;

  background:

    linear-gradient(
      110deg,
      transparent,
      rgba(255,255,255,.55),
      transparent
    );

  transform:skewX(-20deg);

  animation:
    systemShine 3.5s ease-in-out infinite;

}


@keyframes systemShine{

  0%,35%{
    left:-80%;
  }

  65%,100%{
    left:140%;
  }

}


@keyframes systemFloat{

  0%,100%{

    transform:translateY(0);

    box-shadow:

      0 4px 0 #000,

      0 7px 15px rgba(0,0,0,.4),

      0 0 14px rgba(0, 136, 255, 0.2);

  }

  50%{

    transform:translateY(-3px);

    box-shadow:

      0 7px 0 #000,

      0 10px 18px rgba(0,0,0,.5),

      0 0 24px rgba(0, 174, 255, 0.4);

  }

}


/* =================================
   HERO
================================= */

.hero{

  position:relative;

  margin-bottom:16px;
}


.hero-media{

  position:relative;

  overflow:hidden;

  border-radius:16px;

  border:4px solid #000;

  background:#111;

  box-shadow:

    0 0 0 2px rgba(0, 149, 255, 0.25) inset,

    0 10px 20px rgba(0,0,0,.5),

    0 0 18px rgba(0, 119, 255, 0.16);
}


/* HERO LIGHT */

.hero-media::before{

  content:"";

  position:absolute;

  inset:0;

  z-index:2;

  pointer-events:none;

  background:

    linear-gradient(
      135deg,
      rgba(255,255,255,.13),
      transparent 18%,
      transparent 78%,
      rgba(255,215,0,.10)
    ),

    radial-gradient(
      circle at 15% 20%,
      rgba(255,215,0,.12),
      transparent 20%
    );
}


/* SCANLINES */

.hero-media::after{

  content:"";

  position:absolute;

  inset:0;

  z-index:3;

  pointer-events:none;

  background:

    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.06) 0 1px,
      transparent 1px 4px
    );

  opacity:.18;
}


.hero amp-img{
  display:block;
}


/* =================================
   BOOT SCREEN
================================= */

.boot-overlay{

  position:absolute;

  inset:0;

  z-index:5;

  display:flex;

  align-items:center;

  justify-content:center;

  background:

    radial-gradient(
      circle at center,
      #fff9d6,
      #0066ff47 65%,
      #d889001d 100%
    );

  box-shadow:
    0 0 18px #0059ff;

  animation:
    bootFadeOut .6s ease-out 2.2s forwards;

  pointer-events:none;
}


.boot-logo{

  font-family:'Press Start 2P',cursive;

  font-size:28px;

  line-height:1.5;

  color:#050505;

  opacity:0;

  transform:translateY(-140px);

  text-shadow:

    3px 0 #0059ff,

    -3px 0 #0073ff,

    0 3px #000;

  animation:

    logoDrop 1.5s cubic-bezier(.25,1,.5,1) forwards,

    glitchEffect .45s ease-in-out 1.1s 3;
}


.boot-logo span{

  font-size:11px;

  vertical-align:top;

  margin-left:2px;
}


@keyframes logoDrop{

  0%{
    opacity:1;
    transform:translateY(-140px) scale(.8);
  }

  55%{
    transform:translateY(0) scale(1.08);
  }

  75%{
    transform:translateY(-5px) scale(1);
  }

  100%{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


/* GOLD GLITCH */

@keyframes glitchEffect{

  0%,100%{

    text-shadow:

      3px 0 #0059ff,
      -3px 0 #0091ff,
      0 3px #000;

    transform:translate(0);
  }

  25%{

    text-shadow:

      -3px 0 #a6e4ff,
      3px 0 #0062d9,
      0 3px #000;

    transform:translate(2px,-1px);
  }

  50%{

    text-shadow:

      3px 0 #0073ff,
      -3px 0 #7abfff,
      0 3px #000;

    transform:translate(-2px,1px);
  }

}


@keyframes bootFadeOut{

  to{
    opacity:0;
    visibility:hidden;
  }

}


/* =================================
   MENU
================================= */

.menu{
  margin-top:8px;
}


.menu a{

  display:block;

  position:relative;

  margin:14px 0;

  padding:15px 16px;

  text-decoration:none;

  text-transform:uppercase;

  text-align:center;

  font-family:'Press Start 2P',cursive;

  font-size:11px;

  line-height:1.6;

  color:#fff;

  text-shadow:

    2px 2px 0 #000;

  border:3px solid #000;

  border-radius:14px;

  background:

    linear-gradient(
      180deg,
      #a6e4ff 0%,
      #0059ff 30%,
      #0073ff 65%,
      #0061c8 100%
    );

  box-shadow:

    0 4px 0 #000,

    0 0 14px rgba(0, 140, 255, 0.22),

    inset 0 1px 0 rgba(255,255,255,.45);

  overflow:hidden;

  transition:

    transform .18s ease,

    filter .18s ease,

    box-shadow .18s ease;
}


/* EVEN MENU */

.menu a:nth-child(even){

  background:

    linear-gradient(
      180deg,
      #a0e4ff 0%,
      #0099ff 32%,
      #0080e9 68%,
      #0071a9 100%
    );
}


/* CLICK */

.menu a:active{

  transform:translateY(4px);

  box-shadow:

    0 1px 0 #000,

    0 0 12px rgba(0, 153, 255, 0.3);
}


/* SHIMMER */

.menu a::before{

  content:"";

  position:absolute;

  top:0;

  left:-120%;

  width:65%;

  height:100%;

  background:

    linear-gradient(
      110deg,
      transparent,
      rgba(255,255,255,.5),
      transparent
    );

  transform:skewX(-20deg);

  animation:
    menuShine 4s ease-in-out infinite;

  pointer-events:none;
}


@keyframes menuShine{

  0%,35%{
    left:-120%;
  }

  65%,100%{
    left:140%;
  }

}


/* =================================
   MOVING BORDER
================================= */

.menu a span{

  position:absolute;

  display:block;
}


.menu a span:nth-child(1){

  top:0;
  left:0;

  width:100%;
  height:3px;

  background:
    linear-gradient(
      to left,
      transparent,
      #fff,
      #0059ff,
      transparent
    );

  animation:
    animateTop 2.2s linear infinite;
}


.menu a span:nth-child(2){

  top:0;
  right:0;

  width:3px;
  height:100%;

  background:
    linear-gradient(
      to top,
      transparent,
      #fff,
      #0059ff,
      transparent
    );

  animation:
    animateRight 2.2s linear infinite;

  animation-delay:-1.1s;
}


.menu a span:nth-child(3){

  bottom:0;
  left:0;

  width:100%;
  height:3px;

  background:
    linear-gradient(
      to right,
      transparent,
      #fff,
      #0059ff,
      transparent
    );

  animation:
    animateBottom 2.2s linear infinite;
}


.menu a span:nth-child(4){

  top:0;
  left:0;

  width:3px;
  height:100%;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #fff,
      #0059ff,
      transparent
    );

  animation:
    animateLeft 2.2s linear infinite;

  animation-delay:-1.1s;
}


@keyframes animateTop{

  0%{
    transform:translateX(100%);
  }

  100%{
    transform:translateX(-100%);
  }

}


@keyframes animateRight{

  0%{
    transform:translateY(100%);
  }

  100%{
    transform:translateY(-100%);
  }

}


@keyframes animateBottom{

  0%{
    transform:translateX(-100%);
  }

  100%{
    transform:translateX(100%);
  }

}


@keyframes animateLeft{

  0%{
    transform:translateY(-100%);
  }

  100%{
    transform:translateY(100%);
  }

}


/* =================================
   INFO TABLE
================================= */

.info-wrap{

  margin-top:18px;

  overflow:hidden;

  border:4px solid #000;

  border-radius:16px;

  background:

    linear-gradient(
      180deg,
      rgba(8,8,8,.96),

    );

  box-shadow:

    0 4px 0 #000,

    0 0 18px rgba(0, 170, 255, 0.2);

  color:#fff;

.info-table thead th{

    linear-gradient(

    );

  color:#fff;

  font-family:'Press Start 2P',cursive;

  font-weight:700;

  font-size:18px;

  text-shadow:

    2px 2px 0 #000;

  text-align:center;

  padding:13px 12px;

  border-bottom:4px solid #000;

  text-transform:uppercase;

  letter-spacing:.5px;
}


.info-table tbody tr{

.info-table tbody tr + tr td{

}


/* =================================
   FOOTER
================================= */

.footer{

  position:relative;

  z-index:1;

  margin-top:16px;

  text-align:center;

  padding:12px 14px;

  border:4px solid #000;

  border-radius:14px;

  background:

    linear-gradient(
      180deg,
      #a6e4ff,
      #0059ff 35%,
      #0073ff 70%,
      #0061c8 100%
    );

  font-family:'Press Start 2P',cursive;
